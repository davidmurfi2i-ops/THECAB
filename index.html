<title>The Cab</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:18px 18px 24px}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em}h2{font-size:26px;font-weight:800}h3{font-size:18px;font-weight:600}
p{margin:0}.mut{color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.trk:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sign{display:inline-block;background:var(--yel);color:#fff;font:800 15px "Bricolage Grotesque",sans-serif;letter-spacing:.12em;padding:6px 16px 5px;border-radius:10px 10px 4px 4px;position:relative;margin-bottom:18px}
.sign:before,.sign:after{content:"";position:absolute;bottom:-7px;width:10px;height:7px;background:var(--mut);border-radius:0 0 2px 2px}.sign:before{left:12px}.sign:after{right:12px}
.hero{background:linear-gradient(135deg,#8B3DFF,#FF1F4B);color:#fff;border-radius:28px;padding:22px;display:flex;gap:18px;align-items:center;margin:20px 0 14px}
.hero p{opacity:.85;font-size:14px}
.ring{width:92px;height:92px;flex:none}
.btn{display:block;width:100%;text-align:left;padding:16px 18px;border-radius:18px;background:var(--surf);border:1.5px solid var(--line);margin-top:10px}
.btn b{display:block;font:600 18px "Bricolage Grotesque",sans-serif}
.btn span{color:var(--mut);font-size:14px}
.btn.y{background:var(--yel);color:#fff;border-color:var(--yel)}.btn.y span{color:#ffd6de}
.cta{background:var(--blue);color:var(--onb);font-weight:700;padding:15px;border-radius:16px;width:100%;margin-top:14px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surf);padding:6px 10px 8px}

.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:14px 0 20px}.bar div{height:100%;background:var(--blue);transition:width .3s}
.q{font:600 21px/1.25 "Bricolage Grotesque",sans-serif;margin-bottom:18px}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:14px;border:2px solid var(--line);background:var(--surf);border-radius:16px;margin-bottom:10px}

.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surf))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surf))}
.exp{padding:14px;border-radius:16px;background:var(--surf);border:1.5px dashed var(--line);margin:14px 0 0;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:14px;padding:4px;margin:14px 0}
.seg button{padding:10px;border-radius:11px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--surf);color:var(--ink)}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g{width:100%;display:block}.g .t{fill:none;stroke:var(--line);stroke-width:7;stroke-linecap:round}.g .r{fill:none;stroke:var(--bad);stroke-width:7}
.g line{stroke:var(--ink);stroke-width:3;stroke-linecap:round}.g text{fill:var(--ink);font:800 15px "Bricolage Grotesque",sans-serif;text-anchor:middle}.g .s{fill:var(--mut);font:500 8px "DM Sans";}
.coach{display:flex;gap:12px;align-items:center;background:var(--surf);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;min-height:64px}
.badge{flex:none;width:44px;height:44px;border-radius:12px;background:var(--yel);color:#fff;display:grid;place-items:center;font:800 22px "Bricolage Grotesque"}
#msg{font-size:14px}#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}#msg.warn{color:#FFB347}
.mis{margin:12px 0}.mis small{color:var(--mut);font-weight:700}.mis p{font-weight:700;margin-top:2px}
.dots{display:flex;gap:5px;margin-top:8px}.dots i{flex:1;height:5px;border-radius:5px;background:var(--line)}.dots i.d{background:var(--ok)}.dots i.c{background:var(--yel)}
.pedals{display:grid;gap:10px;margin:12px 0}
.pd{height:132px;border-radius:20px;border:2px solid var(--line);background:var(--surf);font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
.pd.on{background:var(--blue);color:var(--onb);border-color:var(--blue)}

.trk .fill{position:absolute;left:0;right:0;top:0;background:var(--yel);opacity:.9}.trk span{position:relative;color:var(--ink)}
.gears{display:flex;gap:6px}.gears button{flex:1;height:50px;border-radius:14px;background:var(--surf);border:2px solid var(--line);font:800 18px "Bricolage Grotesque"}
.gears button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.res{text-align:center;padding:30px 0}.res h1{font-size:64px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.scene{width:100%;display:block;border-radius:22px;border:1.5px solid var(--line);margin-bottom:6px}
#f_clutch{background:var(--blue)}#f_brakeV{background:var(--yel)}#f_gas{background:#fff;opacity:.9}#p_gas span{mix-blend-mode:difference}
.pd span{font-size:14px}.pd{height:150px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px;border-radius:22px;background:var(--surf);border:1.5px solid var(--line);min-height:140px}
.tile i{font-style:normal;font-size:30px;margin-bottom:auto}.tile b{font:600 17px "Bricolage Grotesque"}.tile span{color:var(--mut);font-size:13px}
.tile.g1{background:linear-gradient(140deg,#8B3DFF,#4b1aa6);border:0}.tile.g2{background:linear-gradient(140deg,#FF1F4B,#8a0c2a);border:0}.tile.g1 span,.tile.g2 span{color:#ffffffcc}
.sg{width:150px;height:150px}.big{font:800 56px "Bricolage Grotesque";margin:14px 0}
.bw{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--line);margin:16px 0}
.rbox{width:100%;height:240px;border-radius:26px;font:800 24px "Bricolage Grotesque";background:var(--blue);color:#fff;margin-top:14px;touch-action:manipulation}
.exp.ch{line-height:1.7}
